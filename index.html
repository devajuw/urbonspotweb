<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UrbonSpot</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    #splash {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #fefdfd;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
      dotlottie-player {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  background-color: #fefdfd; /* Match the splash background exactly */
}

    
  </style>
</head>
<body>

  <!-- Splash Screen with .lottie animation -->
  <div id="splash">
    <dotlottie-player
      id="lottieSplash"
      src="https://lottie.host/c858ea71-6cd4-466c-86c4-a6fab2379c1c/asrHWYmFJo.lottie"
      background="transparent"
      speed="1"
      loop="false"
      autoplay
    ></dotlottie-player>
  </div>

  <!-- Environment variables are now loaded via Vite -->
  <script type="module">
    // Make Vite environment variables available globally for compatibility
    window.FIREBASE_API_KEY = import.meta.env.VITE_FIREBASE_API_KEY;
    window.FIREBASE_AUTH_DOMAIN = import.meta.env.VITE_FIREBASE_AUTH_DOMAIN;
    window.FIREBASE_PROJECT_ID = import.meta.env.VITE_FIREBASE_PROJECT_ID;
    window.FIREBASE_STORAGE_BUCKET = import.meta.env.VITE_FIREBASE_STORAGE_BUCKET;
    window.FIREBASE_MESSAGING_SENDER_ID = import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID;
    window.FIREBASE_APP_ID = import.meta.env.VITE_FIREBASE_APP_ID;
    window.FIREBASE_MEASUREMENT_ID = import.meta.env.VITE_FIREBASE_MEASUREMENT_ID;
    window.GOOGLE_MAPS_API_KEY = import.meta.env.VITE_GOOGLE_MAPS_API_KEY;
    window.RAZORPAY_KEY_ID = import.meta.env.VITE_RAZORPAY_KEY_ID;
  </script>

  <!-- DotLottie Player Script -->
  <script type="module" src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"></script>

  <script>
    const lottiePlayer = document.getElementById('lottieSplash');

    // Redirect after animation completes
    lottiePlayer.addEventListener('complete', () => {
      window.location.href = '/Public/home.html'; // Replace with your actual homepage URL
    });
  </script>

</body>
</html>
