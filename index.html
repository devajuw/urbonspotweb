<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UrbonSpot</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    #splash {
      position: fixed;
      width: 100%;
      height: 100%;
      background: #fefdfd;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    dotlottie-player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background-color: #fefdfd;
    }
  </style>
</head>
<body>

  <div id="splash">
    <dotlottie-player
      id="lottieSplash"
      src="https://lottie.host/c858ea71-6cd4-466c-86c4-a6fab2379c1c/asrHWYmFJo.lottie"
      background="transparent"
      speed="1"
      loop="false"
      autoplay
    ></dotlottie-player>
  </div>

  <script type="module">
    // Load environment variables
    const env = {
      FIREBASE_API_KEY: import.meta.env.VITE_FIREBASE_API_KEY,
      FIREBASE_AUTH_DOMAIN: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
      FIREBASE_PROJECT_ID: import.meta.env.VITE_FIREBASE_PROJECT_ID,
      FIREBASE_STORAGE_BUCKET: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
      FIREBASE_MESSAGING_SENDER_ID: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
      FIREBASE_APP_ID: import.meta.env.VITE_FIREBASE_APP_ID,
      FIREBASE_MEASUREMENT_ID: import.meta.env.VITE_FIREBASE_MEASUREMENT_ID,
      GOOGLE_MAPS_API_KEY: import.meta.env.VITE_GOOGLE_MAPS_API_KEY,
      RAZORPAY_KEY_ID: import.meta.env.VITE_RAZORPAY_KEY_ID
    };
    
    // Store in window for other scripts
    Object.assign(window, env);

    const lottiePlayer = document.getElementById('lottieSplash');
    lottiePlayer.addEventListener('complete', () => {
      window.location.href = '/HTML/home.html';
    });
  </script>

  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>

</body>
</html>
