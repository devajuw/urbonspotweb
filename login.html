<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="CSS/stylinglogin.css">
</head>
<body>
    <div class="login-container">
        <div class="left-section">
            <div class="logo">UrbonSpot Icon</div>
            <div class="image-placeholder">Good Image HERE</div>
        </div>
        <div class="right-section">
            <div class="new-user">New User? <a href="register.html">Sign up</a></div>
            <div class="welcome-text">
                <h1>Welcome Back!</h1>
                <p>Login to continue</p>
            </div>
            <form id="login" class="input-fields">
                <div class="input-group">
                    <span class="icon">✉️</span>
                    <input type="email" id="login-email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <div class="actions">
                    <button type="submit" class="login-button">LOGIN</button>
                    <a href="#" class="forgot-password">Forget Password?</a>
                </div>
            </form>
            <button id="google-login" class="google-login-button">
                <span class="icon">🔗</span>
                Login with Google
            </button>
        </div>
    </div>
    <script type="module" src="FireBase/main.js"></script>
</body>
</html>
