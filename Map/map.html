<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Location with Marker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Maps API loaded in location.js -->
    <script src="location.js" defer></script> <!-- Loading location.js that will also load Google Maps API -->
    <script src="script.js" defer></script> <!-- Loading your script.js -->

<body>
    <div class="container">
        <h1>Get Your Location</h1>
        <div class="map-section">
            <button id="get-location">Get My Location</button>
            <div id="output"></div>
            <div id="map"></div>
        </div>
        
    </div>
</body>
</html>
