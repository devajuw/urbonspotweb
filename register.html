<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="CSS/stylinglogin.css">
        <!-- Firebase SDK -->
        <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js"></script>
    </head>
<body>
    <div class="login-container"> <div class="left-section">
            <div class="logo">UrbonSpot Icon</div>
            <div class="image-placeholder">Good Image HERE</div>
        </div>
        <div class="right-section">
             <div class="new-user">Already have an account? <a href="login.html">Login</a></div>
            <div class="welcome-text">
                <h1>Create Your Account</h1>
                <p>Sign up to get started</p>
            </div>
            <form id="register" class="input-fields" action="/your-registration-endpoint" method="POST">
                <div class="input-group">
                    <span class="icon">👤</span>
                    <input type="text" id="register-name" name="name" placeholder="Name" required>
                </div>
                <div class="input-group">
                    <span class="icon">✉️</span> <input type="email" id="register-email" name="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <span class="icon">🔒</span>
                    <input type="password" id="register-password" name="password" placeholder="Password" required>
                </div>
               
                <div class="actions">
                    <button type="submit" class="register-button">REGISTER</button>
                    </div>
            </form>
            <button id="google-signup" class="google-login-button"> <span class="icon">🔗</span> Sign up with Google
            </button>
        </div>
    </div>
    <script type="module" src="FireBase/main.js"></script>
</body>
</html>
