<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Your Parking Space</title>
    <link rel="stylesheet" href="CSS/stylingListSpot.css">  
   </head>
<body>
    <div class="form-container">
        <h2>List Your Parking Space</h2>
        <form id="parkingForm" onsubmit="handleSubmit(event)">

            <!-- Location Details -->
            <div class="form-group">
                <label for="address">Parking Location Address*</label>
                <input type="text" id="address" name="address" required>
            </div>

            <!-- Parking Type -->
            <div class="form-group">
                <label for="type">Parking Type*</label>
                <select id="type" name="type" required>
                    <option value="">Select parking type</option>
                    <option value="driveway">Residential Driveway</option>
                    <option value="garage">Private Garage</option>
                    <option value="lot">Parking Lot</option>
                    <option value="street">Street Parking</option>
                </select>
            </div>

            <!-- Availability -->
            <div class="form-group">
                <label>Availability*</label>
                <div class="availability-time">
                    <div class="time-input">
                        <input type="time" id="startTime" name="startTime" required>
                    </div>
                    <span>to</span>
                    <div class="time-input">
                        <input type="time" id="endTime" name="endTime" required>
                    </div>
                </div>
            </div>

            <!-- Days Available -->
            <div class="form-group">
                <label>Days Available*</label><br>
                <label><input type="checkbox" name="days" value="mon"> Monday</label>
                <label><input type="checkbox" name="days" value="tue"> Tuesday</label>
                <label><input type="checkbox" name="days" value="wed"> Wednesday</label>
                <label><input type="checkbox" name="days" value="thu"> Thursday</label>
                <label><input type="checkbox" name="days" value="fri"> Friday</label>
                <label><input type="checkbox" name="days" value="sat"> Saturday</label>
                <label><input type="checkbox" name="days" value="sun"> Sunday</label>
            </div>

            <!-- Pricing -->
            <div class="form-group">
                <label for="price">Hourly Rate (₹)*</label>
                <input type="number" id="price" name="price" min="0" step="10" required>
            </div>

            <!-- Space Photo -->
            <div class="form-group">
                <label for="photo">Upload Space Photo</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>

            <!-- Additional Info -->
            <div class="form-group">
                <label for="notes">Additional Notes</label>
                <textarea id="notes" name="notes" rows="4"></textarea>
            </div>

            <!-- Contact Info -->
            <div class="form-group">
                <label for="contact">Contact Number*</label>
                <input type="number" id="contact" name="contact" required>
            </div>

            <button type="submit">List My Space</button>
        </form>
    </div>
    <script>
        function handleSubmit(event) {
            event.preventDefault(); // Prevent actual form submission
            alert("Your parking spot has been listed!");
            window.location.href = "index.html"; // Redirect to home page
        }
        </script>
        
</body>
</html>
