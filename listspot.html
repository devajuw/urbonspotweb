<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List Your Parking Spot</title>
  <link rel="stylesheet" href="CSS/listspot.css">
  <!-- Google Maps JavaScript API (for geocoding) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAlUjF8he099BRUCD-B5_6QGuyRDUNESFY"></script>
</head>
<body>
  <div class="form-container">
    <form id="parkingForm">
      <input type="text" id="address" placeholder="Address" required>
      <select id="type" required>
        <option value="">Select Type</option>
        <option value="garage">Garage</option>
        <option value="driveway">Driveway</option>
        <option value="lot">Lot</option>
      </select>
      <input type="time" id="startTime" required>
      <input type="time" id="endTime" required>
      <input type="number" id="price" placeholder="Hourly Rate" required>
      <input type="text" id="contact" placeholder="Contact Number" required>
      <textarea id="notes" placeholder="Additional Notes"></textarea>
      <input type="file" id="photo" accept="image/*">
      <div>
        <label><input type="checkbox" name="days" value="Monday">Mon</label>
        <label><input type="checkbox" name="days" value="Tuesday">Tue</label>
        <label><input type="checkbox" name="days" value="Wednesday">Wed</label>
        <label><input type="checkbox" name="days" value="Thursday">Thu</label>
        <label><input type="checkbox" name="days" value="Friday">Fri</label>
        <label><input type="checkbox" name="days" value="Saturday">Sat</label>
        <label><input type="checkbox" name="days" value="Sunday">Sun</label>
      </div>
      <button type="submit">List Spot</button>
    </form>
  </div>

 
  <div id="loading-overlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);z-index:9999;">
    <p style="color:white;">Processing...</p>
  </div>
  <div id="custom-popup" class="popup-overlay" style="display:none;">
    <div class="popup">
      <span class="popup-close" style="cursor:pointer;">&times;</span>
      <h2 class="popup-title"></h2>
      <p class="popup-message"></p>
      <button class="popup-button">OK</button>
    </div>
  </div>
  <div id="debug-panel"></div>
  <div id="firebase-status"></div>
  <div id="auth-status"></div>
  <div id="firestore-status"></div>
  <div id="storage-status"></div>
  <div id="form-status"></div>

  <!--  main JS file as a module -->
  <script type="module" src="listspot.js"></script>
</body>
</html>
