<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/stylinglogin.css">
    <link rel="stylesheet" href="../CSS/body.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- Google Client ID (replace this with your actual client ID) -->
    <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
</head>
<body>
    <div class="login-container">
        <div class="left-section">
            <div class="logo">UrbonSpot</div>
            <div class="image-placeholder"></div>
        </div>
        <div class="right-section">
            
            <div class="welcome-text">
                <h1>Welcome Back!</h1>
                <p>Login to continue</p>
            </div>
           

            <!-- Google Sign-In Button -->
            <div class="google-signin-container">
                <button id="google-login" class="google-signin-btn">
                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo">
                    <span><b>Login or Signup with Google</b></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Your main JS that handles login -->
    <script type="module" src="../Firebase/main.js"></script>

    <!-- Styles for Google button -->
    <style>
        .google-signin-container {
            margin-top: 20px;
            text-align: center;
        }

        .google-signin-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 15px;
            background-color: white;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            color: #3c4043;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .google-signin-btn:hover {
            background-color: #f7f8f8;
        }

        .google-signin-btn img {
            width: 18px;
            height: 18px;
            margin-right: 10px;
        }
    </style>
</body>
</html>
