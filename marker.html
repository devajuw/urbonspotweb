<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parking Space Details</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/marker.css" />
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- Load Google Maps API and functionality as modules -->
    <script type="module" src="JS/marker-loader.js"></script>
    <script type="module" src="JS/marker-main.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="card left-card">
        <div class="header">
          <h2 id="location-name"></h2>
        </div>
        <div class="content">
          <div class="content-grid">
            <div class="map-container">
              <div id="map"></div>
            </div>
            <div>
              <p id="location-description"></p>
              <div class="slideshow-container">
                <div id="slideshow"></div>
                <div class="slide-controls">
                  <button class="slide-btn prev-btn">❮</button>
                  <button class="slide-btn next-btn">❯</button>
                </div>
              </div>
              <div class="slide-nav" id="slide-nav"></div>
              <div class="brand-tagline">UrbonSpot - Parking Made Easy</div>
            </div>
          </div>
        </div>
      </div>

      <div class="card right-card">
        <div class="header">
          <h3>Parking Reservation</h3>
        </div>
        <div class="content">
          <select id="vehicle-type" class="form-select" onchange="updateFare()">
            <option value="2W">🛵 2-Wheeler</option>
            <option value="4W_Small" selected>🚗 Small Car</option>
            <option value="4W_SUV">🚙 SUV/Large Car</option>
          </select>

          <table class="form-table">
            <tr>
              <td>Date:</td>
              <td>
                <input
                  type="date"
                  id="booking-date"
                  class="form-input"
                  required
                />
              </td>
            </tr>
            <tr>
              <td>Time:</td>
              <td>
                <select id="booking-hour" class="form-input" required>
                  <option value="">Select time</option>
                  <option value="08:00">08:00 AM</option>
                  <option value="09:00">09:00 AM</option>
                  <option value="10:00">10:00 AM</option>
                  <option value="11:00">11:00 AM</option>
                  <option value="12:00">12:00 PM</option>
                  <option value="13:00">01:00 PM</option>
                  <option value="14:00">02:00 PM</option>
                  <option value="15:00">03:00 PM</option>
                  <option value="16:00">04:00 PM</option>
                  <option value="17:00">05:00 PM</option>
                  <option value="18:00">06:00 PM</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>Duration:</td>
              <td>
                <select
                  id="booking-duration"
                  class="form-input"
                  onchange="updateFare()"
                  required
                >
                  <option value="1">1 hour</option>
                  <option value="2">2 hours</option>
                  <option value="3">3 hours</option>
                  <option value="4">4 hours</option>
                  <option value="5">5 hours</option>
                  <option value="6">6 hours</option>
                </select>
              </td>
            </tr>
            <tr>
              <td>Vehicle No:</td>
              <td>
                <input
                  type="text"
                  id="vehicle-number"
                  class="form-input"
                  placeholder="DL 01 AB 1234"
                  required
                />
              </td>
            </tr>
            <tr class="fare-row">
              <td>Fare:</td>
              <td><span class="fare-amount" id="fare-estimate">₹60</span></td>
            </tr>
          </table>

          <div class="fare-details">
            <h4>Fare Breakdown</h4>
            <div class="fare-item">
              <span>Base Price:</span>
              <span id="base-price">₹20</span>
            </div>
            <div class="fare-item">
              <span>Hourly Rate:</span>
              <span id="hourly-rate">₹10/hr</span>
            </div>
            <div class="fare-item total-fare">
              <span>Total:</span>
              <span id="total-fare">₹60</span>
            </div>
          </div>

          <button class="btn btn-primary" onclick="getDirections()">
            🗺️ Get Directions
          </button>
          <button class="btn btn-secondary" id="payNow">💳 Pay Now</button>
        </div>
      </div>
    </div>

    <button onclick="window.location.href='/HTML/map.html'" class="back-button">
      ← Back
    </button>

    <!-- All JavaScript functionality is now in JS modules -->
  </body>
</html>
