<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Space Details</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }
        
        .main-container {
            display: flex;
            width: 90%;
            margin: 30px auto;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        .left-section {
            flex: 3;
            min-width: 300px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 25px;
        }
        
        .content-wrapper {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .map-container {
            flex: 1;
            min-width: 300px;
            height: 400px;
        }
        
        .info-container {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
        }
        
        #location-name {
            font-size: 32px;
            margin-bottom: 20px;
            color: #1e3a8a;
            text-align: center;
            font-weight: 600;
        }
        
        #location-description {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
            text-align: justify;
        }
        
        .slideshow-container {
            position: relative;
            height: 250px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        #slideshow {
            height: 100%;
            width: 100%;
            position: relative;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            object-fit: cover;
        }
        
        .slide.active {
            opacity: 1;
        }
        
        .slide-controls {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
        }
        
        .slide-btn {
            background-color: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background-color 0.2s;
        }
        
        .slide-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }
        
        .slide-nav {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        
        .slide-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ccc;
            margin: 0 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .slide-dot.active {
            background-color: #1e3a8a;
        }
        
        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .back-button:hover {
            background-color: #152a60;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
        
        #map {
            height: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .right-section {
            flex: 1;
            min-width: 300px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 25px;
        }
        
        .booking-title {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
        }
        
        .booking-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        .booking-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .booking-table tr:last-child td {
            border-bottom: none;
        }
        
        .booking-table td:first-child {
            font-weight: 600;
            width: 40%;
            color: #555;
        }
        
        .booking-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        
        .booking-input:focus {
            border-color: #1e3a8a;
            outline: none;
        }
        
        .fare-estimate-row {
            background-color: #f0f5ff;
            border-radius: 6px;
        }
        
        .fare-amount {
            font-weight: 700;
            color: #1e3a8a;
            font-size: 18px;
        }
        
        .fare-details {
            background-color: #f0f5ff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .fare-details h4 {
            margin-top: 0;
            color: #1e3a8a;
            margin-bottom: 12px;
        }
        
        .fare-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .total-fare {
            border-top: 1px dashed #1e3a8a;
            margin-top: 8px;
            padding-top: 8px;
            font-weight: 700;
            font-size: 18px;
        }
        
        .vehicle-type-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 15px;
        }
        
        .book-button {
            display: block;
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-family: 'Poppins', sans-serif;
        }
        
        .directions-btn {
            background-color: #4285F4;
            margin-bottom: 10px;
        }
        
        .directions-btn:hover {
            background-color: #3367d6;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
        
        .pay-now-btn {
            background-color: #4CAF50;
        }
        
        .pay-now-btn:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Left section with map and info -->
        <div class="left-section">
            <h2 id="location-name"></h2>
            <div class="content-wrapper">
                <div class="map-container">
                    <div id="map"></div>
                </div>
                <div class="info-container">
                    <p id="location-description"></p>
                    <div class="slideshow-container">
                        <div id="slideshow"></div>
                        <div class="slide-controls">
                            <button class="slide-btn prev-btn">❮</button>
                            <button class="slide-btn next-btn">❯</button>
                        </div>
                    </div>
                    <div class="slide-nav" id="slide-nav"></div>
                </div>
            </div>
        </div>
        
        <!-- Right section with booking form -->
        <div class="right-section">
            <h3 class="booking-title">Parking Reservation</h3>
            
            <select id="vehicle-type" class="vehicle-type-select" onchange="updateFareEstimate()">
                <option value="2W">🛵 2-Wheeler</option>
                <option value="4W_Small" selected>🚗 Small Car (e.g., Alto, Swift)</option>
                <option value="4W_SUV">🚙 SUV/Large Car (e.g., Creta, Fortuner)</option>
            </select>
            
            <table class="booking-table">
                <tr>
                    <td>Date:</td>
                    <td><input type="date" id="booking-date" class="booking-input" required></td>
                </tr>
                <tr>
                    <td>Time:</td>
                    <td>
                        <select id="booking-hour" class="booking-input" required>
                            <option value="">Select time</option>
                            <option value="08:00">08:00 AM</option>
                            <option value="09:00">09:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="13:00">01:00 PM</option>
                            <option value="14:00">02:00 PM</option>
                            <option value="15:00">03:00 PM</option>
                            <option value="16:00">04:00 PM</option>
                            <option value="17:00">05:00 PM</option>
                            <option value="18:00">06:00 PM</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Duration:</td>
                    <td>
                        <select id="booking-duration" class="booking-input" onchange="updateFareEstimate()" required>
                            <option value="1">1 hour</option>
                            <option value="2">2 hours</option>
                            <option value="3">3 hours</option>
                            <option value="4">4 hours</option>
                            <option value="5">5 hours</option>
                            <option value="6">6 hours</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Vehicle Number:</td>
                    <td><input type="text" id="vehicle-number" class="booking-input" placeholder="DL 01 AB 1234" required></td>
                </tr>
                <tr class="fare-estimate-row">
                    <td>Estimated Fare:</td>
                    <td><span class="fare-amount" id="fare-estimate">₹60</span></td>
                </tr>
            </table>
            
            <div class="fare-details">
                <h4>Fare Breakdown</h4>
                <div class="fare-item">
                    <span>Base Price:</span>
                    <span id="base-price">₹20</span>
                </div>
                <div class="fare-item">
                    <span>Hourly Rate:</span>
                    <span id="hourly-rate">₹10 per hour</span>
                </div>
                <div class="fare-item">
                    <span>Late Fee:</span>
                    <span>₹25 per 15 min</span>
                </div>
                <div class="fare-item total-fare">
                    <span>Total Estimate:</span>
                    <span id="total-fare-estimate">₹60</span>
                </div>
            </div>
            
            <button class="book-button directions-btn" onclick="openGoogleMaps()">
                🗺️ Get Directions
            </button>
            
            <button class="book-button pay-now-btn" id="payNow">
                💳 Pay Now
            </button>
        </div>
    </div>
    <script>
        // Function to process payment
        function processPayment() {
            // Validate form
            const date = document.getElementById('booking-date').value;
            const time = document.getElementById('booking-hour').value;
            const vehicle = document.getElementById('vehicle-number').value;

            if (!date || !time || !vehicle) {
                alert('Please fill in all booking details before proceeding.');
                return false; // Return false to indicate validation failure
            }

            // Get calculated fare
            const fare = document.getElementById('fare-estimate').textContent;
            const numericFare = parseInt(fare.replace('₹', '').replace(',', '').trim()) * 100; // Convert to paise

            // Store booking data with actual fare
            const bookingData = {
                location: "Your Location Name", // Replace with actual location name
                date,
                time,
                vehicle,
                fare: numericFare,
                lat: 0, // Replace with actual latitude
                lng: 0, // Replace with actual longitude
                userLat: 0, // Replace with actual user latitude
                userLng: 0 // Replace with actual user longitude
            };

            return bookingData; // Return booking data for further processing
        }

        document.getElementById('payNow').onclick = function(e) {
            e.preventDefault(); // Prevent default button behavior

            const bookingData = processPayment(); // Call processPayment and get booking data

            if (!bookingData) {
                return; // If validation fails, exit the function
            }

            // Proceed with Razorpay payment
            var options = {
                "key": "rzp_live_fZqJYl2cPlP44W", // Replace with your Razorpay key ID
                "amount": bookingData.fare, // Amount in paise
                "currency": "INR",
                "name": "Parking Reservation",
                "description": "Payment for parking reservation",
                "image": "https://example.com/your_logo.jpg", // Replace with your logo URL
                "handler": function(response) {
                    // Handle successful payment here
                    const paymentData = {
                        paymentId: response.razorpay_payment_id,
                        vehicleNumber: bookingData.vehicle,
                        bookingDate: bookingData.date,
                        bookingTime: bookingData.time,
                        amount: bookingData.fare / 100 // Convert back to main currency units
                    };

                    // Store payment data in sessionStorage
                    sessionStorage.setItem('paymentData', JSON.stringify(paymentData));

                    // Show payment confirmation on the same page
                    window.location.href = 'confirmation.html';
                },
                "prefill": {
                    "name": "Customer Name", // Replace with actual customer name
                    "email": "customer@example.com", // Replace with actual customer email
                    "contact": "9999999999" // Replace with actual customer contact
                },
                "theme": {
                    "color": "#F37254"
                }
            };

            var rzp1 = new Razorpay(options);
            rzp1.open();
        };
        </script>

    <!-- Back button positioned in the bottom left corner -->
    <a href="map.html" class="back-button">← Back to Map</a>

    <script>
        // Get location parameters from URL
      // Get location parameters from URL
const urlParams = new URLSearchParams(window.location.search);
const lat = parseFloat(urlParams.get('lat'));
const lng = parseFloat(urlParams.get('lng'));
const name = decodeURIComponent(urlParams.get('name'));
const userLat = urlParams.get('userLat');
const userLng = urlParams.get('userLng');
        
        let slideIndex = 0;
        let slides = [];
        
        // Vehicle pricing structure
        const vehiclePricing = {
            '2W': { base: 10, hourly: 20 },
            '4W_Small': { base: 20, hourly: 10 },
            '4W_SUV': { base: 30, hourly: 15 }
        };

        // Set default date to today
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            document.getElementById('booking-date').valueAsDate = today;
            
            // Initialize the page
            initPage();
        });

        function initPage() {
            // Set location name
            document.getElementById('location-name').textContent = name;
            
            // Set default description
            document.getElementById('location-description').textContent = 
                `This parking location in ${name} offers secure and convenient parking spaces. Our facility features 24/7 surveillance, well-lit areas, and easy access to major attractions. Reserve your spot now for a hassle-free parking experience.`;
            
            // Initialize slideshow with placeholder images
            initSlideshow();
            
            // Initialize map
            initMap();
            
            // Initialize fare estimate
            updateFareEstimate();
        }

        function initSlideshow() {
            const slideshow = document.getElementById('slideshow');
            const slideNav = document.getElementById('slide-nav');
            
            // Sample images
            const sampleImages = [
                'https://via.placeholder.com/800x400?text=Parking+Facility',
                'https://via.placeholder.com/800x400?text=Secure+Parking',
                'https://via.placeholder.com/800x400?text=24/7+Surveillance'
            ];
            
            sampleImages.forEach((imageUrl, index) => {
                // Create image element
                const slide = document.createElement('img');
                slide.src = imageUrl;
                slide.className = index === 0 ? 'slide active' : 'slide';
                slide.alt = `Parking location ${index + 1}`;
                slideshow.appendChild(slide);
                slides.push(slide);
                
                // Create navigation dot
                const dot = document.createElement('div');
                dot.className = index === 0 ? 'slide-dot active' : 'slide-dot';
                dot.addEventListener('click', () => showSlide(index));
                slideNav.appendChild(dot);
            });
            
            // Add slide navigation
            document.querySelector('.prev-btn').addEventListener('click', () => showSlide(slideIndex - 1));
            document.querySelector('.next-btn').addEventListener('click', () => showSlide(slideIndex + 1));
            
            // Start automatic slideshow
            setInterval(() => showSlide(slideIndex + 1), 3000);
        }

        function showSlide(index) {
            if (slides.length === 0) return;
            
            if (index >= slides.length) index = 0;
            else if (index < 0) index = slides.length - 1;
            
            const dots = document.querySelectorAll('.slide-dot');
            slides.forEach((slide, i) => {
                slide.classList.remove('active');
                dots[i].classList.remove('active');
            });
            
            slides[index].classList.add('active');
            dots[index].classList.add('active');
            slideIndex = index;
        }

        function initMap() {
            const map = new google.maps.Map(document.getElementById('map'), {
                zoom: 15,
                center: { lat, lng },
                mapTypeId: 'terrain'
            });
            
            // Add parking location marker
            new google.maps.Marker({
                position: { lat, lng },
                map: map,
                title: name,
                icon: {
                    url: 'http://maps.google.com/mapfiles/ms/icons/red-dot.png',
                    scaledSize: new google.maps.Size(40, 40)
                }
            });
            
            // Add user location marker if available
            if (userLat && userLng) {
                new google.maps.Marker({
                    position: { lat: parseFloat(userLat), lng: parseFloat(userLng) },
                    map: map,
                    title: "Your Location",
                    icon: {
                        url: 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png',
                        scaledSize: new google.maps.Size(40, 40)
                    }
                });
                
                // Draw a line between user and parking location
                new google.maps.Polyline({
                    path: [
                        { lat: parseFloat(userLat), lng: parseFloat(userLng) },
                        { lat, lng }
                    ],
                    geodesic: true,
                    strokeColor: '#1e3a8a',
                    strokeOpacity: 0.7,
                    strokeWeight: 3,
                    map: map
                });
                
                // Fit bounds to show both markers
                const bounds = new google.maps.LatLngBounds();
                bounds.extend(new google.maps.LatLng(lat, lng));
                bounds.extend(new google.maps.LatLng(parseFloat(userLat), parseFloat(userLng)));
                map.fitBounds(bounds);
            }
        }

        function updateFareEstimate() {
            const vehicleType = document.getElementById('vehicle-type').value;
            const duration = parseInt(document.getElementById('booking-duration').value) || 1;
            const pricing = vehiclePricing[vehicleType] || vehiclePricing['4W_Small'];
            
            const totalFare = pricing.base + (pricing.hourly * duration);
            
            // Update displays
            document.getElementById('base-price').textContent = `₹${pricing.base}`;
            document.getElementById('hourly-rate').textContent = `₹${pricing.hourly} per hour`;
            document.getElementById('fare-estimate').textContent = `₹${totalFare}`;
            document.getElementById('total-fare-estimate').textContent = `₹${totalFare}`;
        }

        function openGoogleMaps() {
    // Check if we have both user location and parking location
    if (userLat && userLng && lat && lng) {
        // Store current URL in sessionStorage before opening maps
        sessionStorage.setItem('returnUrl', window.location.href);
        
        const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${lat},${lng}&travelmode=driving`;
        window.open(`dir.html?origin=${userLat},${userLng}&destination=${lat},${lng}`, '_blank');

    } else {
        // Try to get user location if not available
        if (!userLat || !userLng) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${position.coords.latitude},${position.coords.longitude}&destination=${lat},${lng}&travelmode=driving`;
                        window.open(`dir.html?origin=${userLat},${userLng}&destination=${lat},${lng}`, '_blank');

                    },





                    
                    function(error) {
                        alert('Could not get your location. Please enable location services or manually enter your location.');
                    }
                );
            } else {
                alert('Geolocation is not supported by your browser. Please enter your location manually.');
            }
        } else {
            alert('Missing location information. Please try selecting the parking spot again.');
        }
    }
}  
    </script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAlUjF8he099BRUCD-B5_6QGuyRDUNESFY&callback=initMap" async defer></script>
</body>
</html>
