<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/CSS/body.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
           
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #1e3a8a;
        }
        .confirmation-container {
            background-color: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            display: inline-block;
            position: relative;
            overflow: hidden;
            transform: translateZ(0);
            transition: transform 0.3s;
        }
        .confirmation-container:hover {
            transform: scale(1.05);
        }
        .checkmark {
            top: 59px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: #4CAF50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            position: absolute;
            left: calc(50% - 30px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .confirmation-details {
            margin-top: 40px;
        }
        .confirmation-details p {
            margin: 10px 0;
            font-size: 18px;
        }
        .confirmation-details strong {
            color: #1e3a8a;
        }
        .download-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .download-button:hover {
            background-color: #45a049;
        }
    
    </style>
</head>
<body>
    <div class="confirmation-container">
        <div class="checkmark">✔</div>
        <h1>Order Confirmation</h1>
        <div class="confirmation-details">
            <p>Thank you for your reservation!</p>
            <p><strong>Payment ID:</strong> <span id="payment-id"></span></p>
            <p><strong>Vehicle Number:</strong> <span id="vehicle-number"></span></p>
            <p><strong>Booking Date:</strong> <span id="booking-date"></span></p>
            <p><strong>Booking Time:</strong> <span id="booking-time"></span></p>
            
            <p><strong>Amount Paid:</strong> <span id="amount-paid"></span></p>
        </div>
        <button class="download-button" id="downloadBtn">Download Confirmation as PDF</button>
    </div>

    <script>
        // Fetch payment data from sessionStorage
        const paymentData = JSON.parse(sessionStorage.getItem('paymentData'));

        if (paymentData) {
            document.getElementById('payment-id').textContent = paymentData.paymentId;
            document.getElementById('vehicle-number').textContent = paymentData.vehicleNumber;
            document.getElementById('booking-date').textContent = paymentData.bookingDate;
            document.getElementById('booking-time').textContent = paymentData.bookingTime;
            // document.getElementById('vehicle-type').textContent = paymentData.vehicleType;
            document.getElementById('amount-paid').textContent = `${paymentData.amount}`;
        } else {
            document.querySelector('.confirmation-details').innerHTML = '<p>No payment data found.</p>';
        }

        // Function to download the confirmation as a PDF
        document.getElementById('downloadBtn').onclick = function() {
            const { jsPDF } = window.jspdf; // Access jsPDF from the window object
            const doc = new jsPDF();

            // Fetching data from the confirmation details
            const paymentId = document.getElementById('payment-id').textContent;
            const vehicleNumber = document.getElementById('vehicle-number').textContent;
            const bookingDate = document.getElementById('booking-date').textContent;
            const bookingTime = document.getElementById('booking-time').textContent;
            // const vehicleType = document.getElementById('vehicle-type').textContent;
            const amountPaid = document.getElementById('amount-paid').textContent;

            // Set the title and styles
            doc.setFontSize(22);
            doc.text("Order Confirmation", 105, 20, { align: "center" });
            doc.setFontSize(16);
            doc.text("Thank you for your reservation!", 105, 30, { align: "center" });

            // Add payment details
            doc.setFontSize(14);
            doc.text(`Payment ID: ${paymentId}`, 10, 50);
            doc.text(`Vehicle Number: ${vehicleNumber}`, 10, 60);
            doc.text(`Booking Date: ${bookingDate}`, 10, 70);
            doc.text(`Booking Time: ${bookingTime}`, 10, 80);
            // doc.text(`Vehicle Type: ${vehicleType}`, 10, 90);
            doc.text(`Amount Paid: RS ${amountPaid}`, 10, 100); // Ensure the rupee sign is included

            // Save the PDF
            doc.save("order_confirmation.pdf");
        };
        document.getElementById('homeBtn').onclick = function() {
            window.location.href = 'main page.html'; // Change 'index.html' to your actual homepage URL
        };
    </script>
</body>
</html>
