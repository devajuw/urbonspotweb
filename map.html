<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Spots Map</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .button-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .nav-button {
            background: #2196F3;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .location-button {
            background: #43a047;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        #map { 
            height: 80vh; 
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .range-section {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        #range-value {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Add this inside map.html -->
<div id="directions-container" style="display:none;">
    <button id="go-back-btn" class="directions-btn">Go Back</button>
    <div class="map-responsive">
      <iframe
        id="directions-iframe"
        width="100%"
        height="450"
        frameborder="0"
        style="border:0"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
        src="">
      </iframe>
    </div>
  </div>
  
    <div class="container">
        <h1>Parking Spots Map</h1>
        
        <div class="button-container">
            <button class="nav-button" onclick="window.location.href='index.html'">
                Back to Home
            </button>
            
            <button id="show-my-location" class="location-button">
                Show My Current Location
            </button>
            
            <!-- <button id="getDirectionsBtn" class="nav-button" onclick="redirectToDirections()">
                Get Directions
            </button> -->
        </div>
        
        <div class="range-section">
            <label for="range-slider">Range: <span id="range-value">0</span> km</label>
            <input type="range" id="range-slider" min="0" max="20" value="0">
            <button id="reset-range" class="nav-button">Reset</button>
        </div>
        
        <div id="map"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAlUjF8he099BRUCD-B5_6QGuyRDUNESFY"></script>
    
    <script>
        let map, userLocationMarker;
        let firestoreMarkers = [];
        let jsonMarkers = [];
        let userLocation = null;
        let selectedSpotId = null;
        
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB5rM-Z_YxL6mpPb5qX3S7A-ykBshAA_Ro",
            authDomain: "dev-85f8d.firebaseapp.com",
            projectId: "dev-85f8d",
            storageBucket: "dev-85f8d.appspot.com",
            messagingSenderId: "884673937857",
            appId: "1:884673937857:web:97943fdefae91ccfe36f40",
            measurementId: "G-4CR2VG9QTK"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Function to handle spot selection
        window.selectSpot = function(spotId, lat, lng, address) {
            console.log(`Selected parking spot: ${spotId} at ${lat},${lng}`);
            
            // Store the selected spot information
            selectedSpotId = spotId;
            localStorage.setItem('selectedSpotId', spotId);
            localStorage.setItem('selectedSpotLat', lat);
            localStorage.setItem('selectedSpotLng', lng);
            localStorage.setItem('selectedSpotAddress', address);
            
            // Visual feedback to user
            alert(`Spot selected: ${address || 'Parking Spot'}\nClick "Get Directions" to navigate to this location.`);
            
            // Update the Get Directions button
            const directionsButton = document.getElementById('getDirectionsBtn');
            directionsButton.style.backgroundColor = '#FF5722';
            directionsButton.style.animation = 'pulse 1.5s infinite';
            
            // Add a style for the animation if it doesn't exist
            if (!document.getElementById('pulseAnimation')) {
                const style = document.createElement('style');
                style.id = 'pulseAnimation';
                style.textContent = `
                    @keyframes pulse {
                        0% { transform: scale(1); }
                        50% { transform: scale(1.05); }
                        100% { transform: scale(1); }
                    }
                `;
                document.head.appendChild(style);
            }
        };
        
        // Function to redirect to directions page
        function redirectToDirections() {
            if (selectedSpotId) {
                window.location.href = 'direction.html';
            } else {
                alert('Please select a parking spot first by clicking on a marker.');
            }
        }
        
        // Function to add markers from Firestore
        async function addFirestoreMarkers() {
            try {
                // Clear existing markers
                firestoreMarkers.forEach(marker => marker.setMap(null));
                firestoreMarkers = [];
                
                console.log("Fetching parking spots from Firestore...");
                
                // Get documents from 'parkingSpots' collection
                const querySnapshot = await db.collection('parkingSpots').get();
                console.log(`Retrieved ${querySnapshot.size} parking spots`);
                
                if (querySnapshot.empty) {
                    console.warn("No parking spots found in database");
                    return;
                }
                
                // Process each document
                querySnapshot.forEach(doc => {
                    try {
                        const data = doc.data();
                        let position;
                        
                        // Handle different possible location formats
                        if (data.location && 
                            typeof data.location.latitude === 'number' && 
                            typeof data.location.longitude === 'number') {
                            position = {
                                lat: data.location.latitude,
                                lng: data.location.longitude
                            };
                        } else if (typeof data.latitude === 'number' && typeof data.longitude === 'number') {
                            position = {
                                lat: data.latitude,
                                lng: data.longitude
                            };
                        } else {
                            console.warn(`Invalid location data in document ${doc.id}:`, data);
                            return;
                        }
                        
                        console.log(`Creating marker at position:`, position);
                        
                        // Create marker
                        const marker = new google.maps.Marker({
                            position: position,
                            map: map,
                            title: data.address || 'Parking Spot',
                            icon: {
                                url: "http://maps.google.com/mapfiles/ms/icons/red-dot.png",
                                scaledSize: new google.maps.Size(40, 40)
                            },
                            animation: google.maps.Animation.DROP
                        });
                        
                        // Create info window with parking spot details
                        const infoWindow = new google.maps.InfoWindow({
                            content: `<div style="min-width:200px">
                                        <h3>${data.address || 'Parking Spot'}</h3>
                                        <p>₹${data.hourlyRate || 0}/hour</p>
                                        ${data.description ? `<p>${data.description}</p>` : ''}
                                        <button onclick="selectSpot('${doc.id}', ${position.lat}, ${position.lng}, '${data.address || 'Parking Spot'}')" 
                                            style="background-color:#4285F4;color:white;border:none;
                                            padding:8px 16px;border-radius:4px;cursor:pointer">
                                            Select Spot
                                        </button>
                                        <button onclick="window.location.href='marker.html?lat=${position.lat}&lng=${position.lng}&name=${encodeURIComponent(data.address || 'Parking Spot')}'"
                                            style="background-color:#34A853;color:white;border:none;
                                            padding:8px 16px;border-radius:4px;cursor:pointer;margin-top:8px">
                                            View Details
                                        </button>
                                    </div>`
                        });
                        
                        // Add click listener to show info window
                        marker.addListener('click', () => {
                            // Close all open info windows first
                            firestoreMarkers.forEach(m => {
                                if (m.infoWindow && m.infoWindow.getMap()) {
                                    m.infoWindow.close();
                                }
                            });
                            jsonMarkers.forEach(m => {
                                if (m.infoWindow && m.infoWindow.getMap()) {
                                    m.infoWindow.close();
                                }
                            });
                            
                            infoWindow.open(map, marker);
                        });
                        
                        // Store reference to info window
                        marker.infoWindow = infoWindow;
                        firestoreMarkers.push(marker);
                    } catch (error) {
                        console.error(`Error processing document ${doc.id}:`, error);
                    }
                });
                
                console.log(`Successfully added ${firestoreMarkers.length} markers to the map`);
            } catch (error) {
                console.error("Error fetching parking spots:", error);
            }
        }
        
        // Function to add markers from JSON data
        function addJsonMarkers() {
            // Clear existing markers
            jsonMarkers.forEach(marker => marker.setMap(null));
            jsonMarkers = [];
            
            // Load JSON data (in a real app, you would fetch this from markerdata.json)
            const jsonData = [
                {
                    "name": "Patna",
                    "description": "Patna, the capital city of Bihar, is steeped in history...",
                    "position": { "lat": 25.5941, "lng": 85.1376 }
                },
                {
                    "name": "Mumbai",
                    "description": "Mumbai, India's financial hub...",
                    "position": { "lat": 19.0760, "lng": 72.8777 }
                },
                {
                    "name": "New Delhi",
                    "description": "New Delhi, the capital of India...",
                    "position": { "lat": 28.6139, "lng": 77.2090 }
                },
                {
                    "name": "Kolkata",
                    "description": "Kolkata, formerly Calcutta...",
                    "position": { "lat": 22.5726, "lng": 88.3639 }
                },
                {
                    "name": "Chennai",
                    "description": "Chennai, the capital of Tamil Nadu...",
                    "position": { "lat": 13.0827, "lng": 80.2707 }
                },
                {
                    "name": "Bengaluru",
                    "description": "Bengaluru, also known as Bangalore...",
                    "position": { "lat": 12.9716, "lng": 77.5946 }
                },
                {
                    "name": "Hyderabad",
                    "description": "Hyderabad is a city of contrasts...",
                    "position": { "lat": 17.3850, "lng": 78.4867 }
                },
                {
                    "name": "Ahmedabad",
                    "description": "Ahmedabad is a major city in Gujarat...",
                    "position": { "lat": 23.0225, "lng": 72.5714 }
                },
                {
                    "name": "Pune",
                    "description": "Pune is a vibrant city in Maharashtra...",
                    "position": { "lat": 18.5204, "lng": 73.8567 }
                },
                {
                    "name": "Jaipur",
                    "description": "Jaipur, the Pink City of India...",
                    "position": { "lat": 26.9124, "lng": 75.7873 }
                }
            ];
            
            jsonData.forEach((location, index) => {
                const marker = new google.maps.Marker({
                    position: location.position,
                    map: map,
                    title: location.name,
                    icon: {
                        url: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png",
                        scaledSize: new google.maps.Size(40, 40)
                    }
                });
                
                // Create info window
                const infoWindow = new google.maps.InfoWindow({
                    content: `<div style="min-width:200px">
                                <h3>${location.name}</h3>
                                <p>${location.description.substring(0, 100)}...</p>
                                <button onclick="selectSpot('json-${index}', ${location.position.lat}, ${location.position.lng}, '${location.name}')" 
                                    style="background-color:#4285F4;color:white;border:none;
                                    padding:8px 16px;border-radius:4px;cursor:pointer">
                                    Select Spot
                                </button>
                                <button onclick="window.location.href='marker.html?lat=${location.position.lat}&lng=${location.position.lng}&name=${encodeURIComponent(location.name)}'"
                                    style="background-color:#34A853;color:white;border:none;
                                    padding:8px 16px;border-radius:4px;cursor:pointer;margin-top:8px">
                                    View Details
                                </button>
                            </div>`
                });
                
                marker.addListener('click', () => {
                    // Close all open info windows first
                    firestoreMarkers.forEach(m => {
                        if (m.infoWindow && m.infoWindow.getMap()) {
                            m.infoWindow.close();
                        }
                    });
                    jsonMarkers.forEach(m => {
                        if (m.infoWindow && m.infoWindow.getMap()) {
                            m.infoWindow.close();
                        }
                    });
                    
                    infoWindow.open(map, marker);
                });
                
                marker.infoWindow = infoWindow;
                jsonMarkers.push(marker);
            });
        }

        // Initialize map after DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 5,
                center: { lat: 20.5937, lng: 78.9629 }, // Center of India
                gestureHandling: 'cooperative',
                zoomControl: true,
                zoomControlOptions: {
                    position: google.maps.ControlPosition.RIGHT_BOTTOM
                }
            });

            // Load markers from both sources
            addFirestoreMarkers();
            addJsonMarkers();
            
            // Range slider functionality
            const rangeSlider = document.getElementById('range-slider');
            const rangeValue = document.getElementById('range-value');
            const resetRange = document.getElementById('reset-range');
            
            rangeSlider.addEventListener('input', function() {
                rangeValue.textContent = this.value;
                // In a complete implementation, you would filter markers by distance here
            });
            
            resetRange.addEventListener('click', function() {
                rangeSlider.value = 0;
                rangeValue.textContent = '0';
                // Reset any filtering
            });

            document.getElementById('show-my-location').addEventListener('click', function() {
                // Show loading indicator or button state
                this.textContent = "Locating...";
                this.disabled = true;
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(function(position) {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        
                        console.log("User location found:", userLocation);
                        
                        if (userLocationMarker) userLocationMarker.setMap(null);
                        
                        userLocationMarker = new google.maps.Marker({
                            position: userLocation,
                            map: map,
                            title: "Your Current Location",
                            icon: { 
                                url: "http://maps.google.com/mapfiles/ms/icons/green-dot.png",
                                scaledSize: new google.maps.Size(40, 40)
                            },
                            animation: google.maps.Animation.DROP
                        });
                        
                        // Create info window for user location
                        const infoWindow = new google.maps.InfoWindow({
                            content: "<div><strong>You are here</strong></div>"
                        });
                        
                        // Add click listener to marker to show info window
                        userLocationMarker.addListener('click', function() {
                            infoWindow.open(map, userLocationMarker);
                        });
                        
                        // First pan to the location
                        map.panTo(userLocation);
                        
                        // Then set zoom after a short delay to ensure smooth transition
                        setTimeout(function() {
                            map.setZoom(16);
                        }, 300);
                        
                        // Store user location in localStorage for directions
                        localStorage.setItem('userLat', userLocation.lat);
                        localStorage.setItem('userLng', userLocation.lng);
                        
                        // Reset button state
                        document.getElementById('show-my-location').textContent = "Show My Current Location";
                        document.getElementById('show-my-location').disabled = false;
                    }, 
                    function(error) {
                        console.error("Geolocation error:", error);
                        alert("Unable to access your location: " + error.message);
                        
                        // Reset button state
                        document.getElementById('show-my-location').textContent = "Show My Current Location";
                        document.getElementById('show-my-location').disabled = false;
                    }, 
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    });
                } else {
                    alert("Geolocation is not supported by this browser.");
                    
                    // Reset button state
                    document.getElementById('show-my-location').textContent = "Show My Current Location";
                    document.getElementById('show-my-location').disabled = false;
                }
            });
            
            // Check if a spot was previously selected and highlight the directions button
            if (localStorage.getItem('selectedSpotId')) {
                selectedSpotId = localStorage.getItem('selectedSpotId');
                const directionsButton = document.getElementById('getDirectionsBtn');
                directionsButton.style.backgroundColor = '#FF5722';
                
                // Add pulse animation
                if (!document.getElementById('pulseAnimation')) {
                    const style = document.createElement('style');
                    style.id = 'pulseAnimation';
                    style.textContent = `
                        @keyframes pulse {
                            0% { transform: scale(1); }
                            50% { transform: scale(1.05); }
                            100% { transform: scale(1); }
                        }
                    `;
                    document.head.appendChild(style);
                }
                
                directionsButton.style.animation = 'pulse 1.5s infinite';
            }
        });
    </script>
</body>
</html>
